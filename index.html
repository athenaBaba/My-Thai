<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>คำ · 泰語詞彙學習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5EFE1; --surface:#FFFFFF; --surface-2:#FBF6EA;
    --ink:#142420; --ink-soft:#5B6B63; --ink-faint:#93A399;
    --accent:#E8A33D; --accent-ink:#2A1B04;
    --brand:#0F5C4B; --brand-soft:#DCEEE6;
    --danger:#B84A3E; --danger-soft:#F6E3DF;
    --success:#2F7D5A; --success-soft:#E1F0E6;
    --border:#E4D9C3; --shadow:0 1px 0 rgba(20,36,32,.06);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0B211F; --surface:#12302C; --surface-2:#0F2A27;
      --ink:#F3EEE1; --ink-soft:#A9BDB4; --ink-faint:#6E8079;
      --accent:#F0B25A; --accent-ink:#241505;
      --brand:#57C7A2; --brand-soft:#163C34;
      --danger:#E8887C; --danger-soft:#3A2320;
      --success:#7BD9AC; --success-soft:#153B2C;
      --border:#1E4740; --shadow:0 1px 0 rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0B211F; --surface:#12302C; --surface-2:#0F2A27;
    --ink:#F3EEE1; --ink-soft:#A9BDB4; --ink-faint:#6E8079;
    --accent:#F0B25A; --accent-ink:#241505;
    --brand:#57C7A2; --brand-soft:#163C34;
    --danger:#E8887C; --danger-soft:#3A2320;
    --success:#7BD9AC; --success-soft:#153B2C;
    --border:#1E4740; --shadow:0 1px 0 rgba(0,0,0,.3);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Prompt","Noto Sans TC",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex; justify-content:center;
  }
  .zh{font-family:"Noto Sans TC","Prompt",system-ui,sans-serif;}
  .th{font-family:"Noto Serif Thai",serif;}
  .en{font-family:"Prompt",system-ui,sans-serif;}

  #app{
    width:100%; max-width:480px; min-height:100vh;
    display:flex; flex-direction:column;
    background:var(--bg);
    position:relative;
  }

  /* ---- top bar ---- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:20px 20px 14px;
    position:sticky; top:0; z-index:5;
    background:var(--bg);
  }
  .topbar .word-th{font-size:26px; font-weight:600; letter-spacing:.02em;}
  .topbar-right{display:flex; align-items:center; gap:10px;}
  .topbar .word-zh{font-size:13px; color:var(--ink-soft); font-weight:500;}
  .settings-btn{
    background:none; border:none; font-size:18px; color:var(--ink-soft);
    padding:4px 4px; line-height:1;
  }

  main{flex:1; overflow-x:hidden; padding:0 20px 100px;}

  /* ---- empty state ---- */
  .empty{
    margin-top:12vh; text-align:center; padding:0 12px;
  }
  .empty .glyph{font-size:40px; margin-bottom:14px; display:block;}
  .empty h2{font-size:18px; margin:0 0 8px; font-weight:600;}
  .empty p{font-size:14px; color:var(--ink-soft); line-height:1.6; margin:0 0 20px;}

  /* ---- buttons ---- */
  button{font-family:inherit; cursor:pointer;}
  .btn{
    border:none; border-radius:12px; padding:13px 20px;
    font-size:15px; font-weight:600; width:100%;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn-brand{background:var(--brand); color:#fff;}
  .btn-accent{background:var(--accent); color:var(--accent-ink);}
  .btn-ghost{background:transparent; color:var(--brand); border:1.5px solid var(--border);}
  .btn:disabled{opacity:.45; cursor:default;}
  .btn-sm{width:auto; padding:9px 16px; font-size:13px; border-radius:10px;}

  /* ---- vocab view ---- */
  .add-form{
    background:var(--surface); border:1px solid var(--border);
    border-radius:16px; padding:16px; margin:6px 0 22px;
  }
  .add-form .row{display:flex; gap:10px; margin-bottom:10px;}
  .add-form input{
    flex:1; min-width:0; border:1.5px solid var(--border); border-radius:10px;
    padding:11px 13px; font-size:16px; background:var(--surface-2); color:var(--ink);
    font-family:inherit;
  }
  .add-form input.th{font-size:18px;}
  .add-form input:focus{outline:2px solid var(--brand); outline-offset:1px;}
  .add-form .hint{font-size:12px; color:var(--ink-faint); margin-top:2px; line-height:1.6;}
  .add-form .hint a{color:var(--brand); font-weight:600;}

  .section-label{
    font-size:13px; color:var(--ink-soft); font-weight:600; margin:4px 0 10px;
  }

  .vocab-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:13px 2px; border-bottom:1px solid var(--border);
  }
  .vocab-row .th-word{font-size:19px; font-weight:600; display:flex; align-items:baseline; gap:8px;}
  .vocab-row .en-word{font-size:12.5px; color:var(--ink-faint); font-weight:500;}
  .vocab-row .zh-word{font-size:13px; color:var(--ink-soft); margin-top:2px;}
  .vocab-row .del{
    background:none; border:none; color:var(--ink-faint); font-size:20px;
    line-height:1; padding:6px 8px;
  }
  .vocab-row .del:active{color:var(--danger);}

  /* ---- practice view ---- */
  .queue-track{
    display:flex; align-items:center; gap:8px; margin:6px 0 22px;
  }
  .queue-track .bar{flex:1; height:5px; background:var(--border); border-radius:3px; overflow:hidden;}
  .queue-track .bar > i{display:block; height:100%; background:var(--brand);}
  .queue-track span{font-size:12px; color:var(--ink-soft); white-space:nowrap;}

  .prompt-card{
    background:var(--surface); border:1px solid var(--border); border-radius:18px;
    padding:20px 18px; margin-bottom:16px;
  }
  .prompt-card .label{font-size:11px; color:var(--ink-faint); font-weight:600; margin-bottom:8px;}
  .prompt-card .zh-sentence{font-size:21px; line-height:1.5; font-weight:600;}

  .build-zone{
    min-height:64px; border:1.5px dashed var(--border); border-radius:16px;
    padding:12px; display:flex; flex-wrap:wrap; gap:8px; align-content:flex-start;
    margin-bottom:18px; background:var(--surface-2);
  }
  .build-zone.empty-hint::before{
    content:"點選下方泰語詞塊,依序拼出句子";
    font-size:13px; color:var(--ink-faint); align-self:center;
  }
  .tile{
    border-radius:10px; padding:8px 14px;
    background:var(--surface); border:1.5px solid var(--border); color:var(--ink);
    display:flex; flex-direction:column; align-items:center; gap:2px; min-width:44px;
  }
  .tile .tile-th{font-size:18px; font-weight:500;}
  .tile .tile-en{font-size:10.5px; color:var(--ink-faint); font-weight:500; letter-spacing:.01em;}
  .tile.placed{background:var(--brand-soft); border-color:var(--brand);}
  .tile.placed .tile-en{color:var(--ink-soft);}
  .tile.used{opacity:.3; pointer-events:none;}

  .bank-label{font-size:12px; color:var(--ink-faint); margin-bottom:8px;}
  .bank{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:22px;}

  .action-row{display:flex; gap:10px;}

  .feedback{
    border-radius:16px; padding:16px 18px; margin-bottom:18px;
  }
  .feedback.correct{background:var(--success-soft); border:1px solid var(--success);}
  .feedback.incorrect{background:var(--danger-soft); border:1px solid var(--danger);}
  .feedback .verdict{font-weight:700; font-size:15px; margin-bottom:6px;}
  .feedback.correct .verdict{color:var(--success);}
  .feedback.incorrect .verdict{color:var(--danger);}
  .feedback .answer-th{font-size:18px; font-weight:600; margin:6px 0 2px;}
  .feedback .answer-en{font-size:12px; color:var(--ink-soft); margin-bottom:6px;}
  .feedback .note{font-size:13px; color:var(--ink-soft); line-height:1.5;}

  .spinner-line{
    display:flex; align-items:center; gap:10px; font-size:13px; color:var(--ink-soft);
    padding:14px 0;
  }
  .dot{width:6px;height:6px;border-radius:50%;background:var(--brand);animation:pulse 1.1s infinite ease-in-out;}
  .dot:nth-child(2){animation-delay:.15s;} .dot:nth-child(3){animation-delay:.3s;}
  @keyframes pulse{0%,80%,100%{opacity:.25; transform:scale(.8);} 40%{opacity:1; transform:scale(1);}}

  /* ---- progress view ---- */
  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:6px 0 24px;}
  .stat-box{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:16px;}
  .stat-box .num{font-size:28px; font-weight:700; color:var(--brand);}
  .stat-box .lbl{font-size:12px; color:var(--ink-soft); margin-top:4px;}
  .word-progress-row{
    display:flex; align-items:center; justify-content:space-between; padding:11px 2px;
    border-bottom:1px solid var(--border); font-size:14px;
  }
  .word-progress-row .th-word{font-weight:600; font-size:16px;}
  .badge{font-size:11px; padding:3px 9px; border-radius:20px; font-weight:600;}
  .badge.mastered{background:var(--success-soft); color:var(--success);}
  .badge.learning{background:var(--brand-soft); color:var(--brand);}
  .badge.new{background:var(--border); color:var(--ink-soft);}

  /* ---- tab bar ---- */
  .tabbar{
    position:fixed; bottom:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:480px;
    background:var(--surface); border-top:1px solid var(--border);
    display:flex; padding:8px 10px calc(10px + env(safe-area-inset-bottom));
    z-index:10;
  }
  .tabbar button{
    flex:1; background:none; border:none; display:flex; flex-direction:column;
    align-items:center; gap:3px; padding:6px 0; color:var(--ink-faint);
  }
  .tabbar button .ic{font-size:20px;}
  .tabbar button .lb{font-size:11px; font-weight:600;}
  .tabbar button.active{color:var(--brand);}

  .banner{
    background:var(--accent); color:var(--accent-ink); font-size:12.5px;
    padding:9px 14px; border-radius:12px; margin:10px 0 18px; line-height:1.5;
  }

  /* ---- floating add button ---- */
  .fab{
    position:fixed; z-index:8;
    right:max(20px, calc((100vw - 480px) / 2 + 20px));
    bottom:calc(78px + env(safe-area-inset-bottom));
    width:56px; height:56px; border-radius:50%;
    background:var(--brand); color:#fff; border:none;
    font-size:28px; font-weight:400; line-height:1;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 16px rgba(15,92,75,.35);
  }
  .fab:active{transform:scale(.94);}

  /* ---- modal sheet (shared: add-word / settings) ---- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(10,20,18,.45);
    z-index:20; display:flex; align-items:flex-end; justify-content:center;
  }
  .sheet{
    width:100%; max-width:480px; background:var(--surface);
    border-radius:22px 22px 0 0; padding:10px 20px calc(24px + env(safe-area-inset-bottom));
    box-shadow:0 -8px 30px rgba(0,0,0,.18);
  }
  .sheet-handle{
    width:36px; height:4px; border-radius:3px; background:var(--border);
    margin:6px auto 16px;
  }
  .sheet-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .sheet-head h3{font-size:16px; margin:0; font-weight:600;}
  .sheet-close{background:none; border:none; font-size:22px; color:var(--ink-faint); padding:4px 6px;}
  .sheet .add-form{margin:0; padding:0; border:none; background:none;}

  ::selection{background:var(--accent); color:var(--accent-ink);}
#loginPage{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#F5EFE1;
}

.loginContainer{
  text-align:center;
}

.loginThai{
  font-size:64px;
  font-weight:700;
  color:#0F5C4B;
  margin-bottom:16px;
}

.loginTitle{
  font-size:20px;
  color:#5B6B63;
  margin-bottom:32px;
}

#googleLoginBtn{
  background:#0F5C4B;
  color:white;
  border:none;
  padding:14px 24px;
  border-radius:12px;
  font-size:16px;
  cursor:pointer;
}
</style>
</head>
<body>

<div id="loginPage">

  <div class="loginContainer">

    <div class="loginThai">
      คำ
    </div>

    <div class="loginTitle">
      泰語詞彙學習
    </div>

    <button id="googleLoginBtn">
      使用 Google 登入
    </button>

  </div>

</div>

<div id="app" style="display:none;">
  <div class="topbar">
    <div>
      <div class="word-th th">คำ</div>
    </div>
    <div class="topbar-right">
      <div class="word-zh zh" id="topbar-sub">泰語詞彙學習</div>
      <button id="settings-btn" class="settings-btn" aria-label="設定">⚙</button>
    </div>
  </div>

  <main id="main"></main>

  <button id="fab" class="fab" aria-label="新增單字">+</button>
  <div id="modal-root"></div>

  <nav class="tabbar">
    <button data-tab="vocab"><span class="ic">詞</span><span class="lb zh">詞彙</span></button>
    <button data-tab="practice"><span class="ic">練</span><span class="lb zh">練習</span></button>
    <button data-tab="progress"><span class="ic">進</span><span class="lb zh">進度</span></button>
  </nav>
</div>

<script>
(function(){
  "use strict";

  // ---------------- config ----------------
  var GEMINI_MODEL = "gemini-3.6-flash";
  var LS_VOCAB = "kham_vocab_v1";
  var LS_SENT = "kham_sentences_v1";
  var LS_KEY = "kham_gemini_api_key";

  var state = {
    view: "vocab",
    ready: false,
    geminiApiKey: "",
    vocab: [],       // {id, thai, english, mandarin, createdAt}
    sentences: [],   // {id, thai, mandarin, tokens[], tokenEnglish[], wordsUsed[], status, correctStreak, wrongCount, totalAttempts, createdAt}
    queue: [],        // array of sentence ids for this practice session
    current: null,    // active sentence object
    tileBank: [],     // [{text, english, used}]
    buildZone: [],    // [{text, english, bankIndex}]
    checking: false,
    generating: false,
    genError: null,
    feedback: null,   // {correct, correctText, note}
    showAddModal: false,
    showSettingsModal: false,
  };

  window.appState = state;

  function $(sel, root){ return (root||document).querySelector(sel); }
  function el(tag, attrs, children){
    var e = document.createElement(tag);
    attrs = attrs || {};
    for (var k in attrs){
      if (k === "class") e.className = attrs[k];
      else if (k === "text") e.textContent = attrs[k];
      else if (k === "html") e.innerHTML = attrs[k];
      else if (k.indexOf("on") === 0) e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    }
    (children||[]).forEach(function(c){ if (c) e.appendChild(c); });
    return e;
  }
  function shuffle(arr){
    var a = arr.slice();
    for (var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t=a[i]; a[i]=a[j]; a[j]=t;
    }
    return a;
  }
  function uid(prefix){
    return prefix + "_" + Date.now() + "_" + Math.random().toString(36).slice(2,9);
  }

  // ---------------- local storage ----------------
  function loadState(){
    try{ state.vocab = JSON.parse(localStorage.getItem(LS_VOCAB) || "[]"); }
    catch(e){ state.vocab = []; }
    try{ state.sentences = JSON.parse(localStorage.getItem(LS_SENT) || "[]"); }
    catch(e){ state.sentences = []; }
    try{ state.geminiApiKey = localStorage.getItem(LS_KEY) || ""; }
    catch(e){ state.geminiApiKey = ""; }
  }
  function saveVocab(){
    try{ localStorage.setItem(LS_VOCAB, JSON.stringify(state.vocab)); }
    catch(e){ console.error("saveVocab failed", e); }
  }
  function saveSentences(){
    try{ localStorage.setItem(LS_SENT, JSON.stringify(state.sentences)); }
    catch(e){ console.error("saveSentences failed", e); }
  }
  function saveApiKey(key){
    state.geminiApiKey = key || "";
    try{ localStorage.setItem(LS_KEY, state.geminiApiKey); }
    catch(e){ console.error("saveApiKey failed", e); }
  }
  function getApiKey(){ return state.geminiApiKey || ""; }

  function init(){
    loadState();
    state.ready = true;
    render();
  }

  // ---------------- Gemini API ----------------
  async function callGemini(prompt){
    var apiKey = getApiKey();
    if (!apiKey) throw new Error("尚未設定 API 金鑰");

    var url = "https://generativelanguage.googleapis.com/v1beta/models/" +
      GEMINI_MODEL + ":generateContent?key=" + encodeURIComponent(apiKey);

var resp;

for (var retry = 0; retry < 3; retry++) {

  resp = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      contents: [{ parts: [{ text: prompt }] }],
      generationConfig: {
        responseMimeType: "application/json",
        temperature: 0.9
      }
    })
  });

  if (resp.ok) {
    break;
  }

  if (resp.status !== 503) {
    break;
  }

  await new Promise(function(resolve){
    setTimeout(resolve, 3000);
  });
}

    if (!resp.ok){
      var errBody = "";
      try{ errBody = await resp.text(); }catch(e2){}
      throw new Error("Gemini API 錯誤 (" + resp.status + ")" + (errBody ? ": " + errBody.slice(0,200) : ""));
    }

    var data = await resp.json();
    var text = data && data.candidates && data.candidates[0] &&
      data.candidates[0].content && data.candidates[0].content.parts &&
      data.candidates[0].content.parts[0] && data.candidates[0].content.parts[0].text;

    if (typeof text !== "string" || !text.trim()){
      throw new Error("Gemini 沒有回傳任何內容");
    }

    var cleaned = text.trim()
      .replace(/^```json\s*/i, "")
      .replace(/^```\s*/, "")
      .replace(/```\s*$/, "")
      .trim();

    return JSON.parse(cleaned);
  }

  // ---------------- vocab actions ----------------
  function addVocab(thai, english, mandarin){

  thai = thai.trim();
  english = english.trim();
  mandarin = mandarin.trim();

  if (!thai || !mandarin) return;

  var doc = {
    id: uid("v"),
    thai: thai,
    english: english,
    mandarin: mandarin,
    createdAt: Date.now()
  };

state.vocab.unshift(doc);

saveVocab();

if (
  window.currentUid &&
  window.firestoreDb &&
  window.firestoreAddDoc &&
  window.firestoreCollection
) {

  window.firestoreAddDoc(

    window.firestoreCollection(
      window.firestoreDb,
      "users",
      window.currentUid,
      "vocab"
    ),

    {
      localId: doc.id,
      thai: thai,
      english: english,
      mandarin: mandarin,
      createdAt: Date.now()
    }

  ).catch(console.error);

}

render();
}

  function deleteVocab(id){

  state.vocab = state.vocab.filter(function(v){
    return v.id !== id;
  });

  saveVocab();

  if (
  window.currentUid &&
  window.firestoreDb
) {

  window.firestoreGetDocs(

    window.firestoreQuery(

      window.firestoreCollection(
        window.firestoreDb,
        "users",
        window.currentUid,
        "vocab"
      ),

      window.firestoreWhere(
        "localId",
        "==",
        id
      )

    )

  ).then(function(snapshot){

    snapshot.forEach(function(docSnap){

      window.firestoreDeleteDoc(
        docSnap.ref
      );

    });

  }).catch(console.error);

}

  render();
}

  // ---------------- sentence generation ----------------
  async function generateSentences(){
    if (!getApiKey() || state.vocab.length === 0 || state.generating) return;
    state.generating = true; state.genError = null; render();

    var count = Math.max(3, Math.min(6, state.vocab.length));
    var wordList = state.vocab.map(function(v){ return {thai: v.thai, english: v.english || "", mandarin: v.mandarin}; });

    var prompt = "你是一位泰語教師,正在為一名母語為中文（繁體）的泰語學習者出練習題。\n" +
      "學習者已學過以下泰語單字（泰語 - 英文拼音 - 繁體中文意思）,以JSON陣列給出:\n" +
      JSON.stringify(wordList) + "\n\n" +
      "請生成 " + count + " 個不同的、自然、語法正確的泰語句子,每個句子必須使用上面列表中的至少一個單字（原樣使用該泰語拼寫）。" +
      "句子難度適合初中級學習者,長度約3到8個泰語詞。所有中文翻譯必須使用「繁體中文」,不可使用簡體字。\n" +
      "只回覆一個JSON陣列,不要有其他文字,陣列每項格式為:\n" +
      '{"thai": "完整泰語句子（詞與詞之間不加空格，符合泰文書寫習慣）", ' +
      '"mandarin": "對應的繁體中文翻譯", ' +
      '"tokens": [{"thai":"泰語詞塊", "english":"該詞塊的英文拼音/羅馬拼音，方便中文使用者記憶發音"}, ...] // 按順序切分，所有 thai 欄位依序拼接起來必須與上面 thai 欄位完全相同, ' +
      '"wordsUsed": ["本句中用到的、且出現在學習者詞表中的泰語單字"]}';

    try{
      var result = await callGemini(prompt);
      if (!Array.isArray(result)) throw new Error("Gemini 回傳格式不是陣列");

      for (var i=0;i<result.length;i++){
        var s = result[i];
        if (!s || !s.thai || !s.mandarin || !Array.isArray(s.tokens) || s.tokens.length === 0) continue;
        var tokThai = s.tokens.map(function(t){ return (t && t.thai) ? t.thai : ""; });
        var tokEnglish = s.tokens.map(function(t){ return (t && t.english) ? t.english : ""; });
        if (tokThai.join("") !== s.thai) continue; // integrity check
        var doc = {
          id: uid("s"),
          thai: s.thai, mandarin: s.mandarin, tokens: tokThai, tokenEnglish: tokEnglish,
          wordsUsed: Array.isArray(s.wordsUsed) ? s.wordsUsed : [],
          status: "new", correctStreak: 0, wrongCount: 0, totalAttempts: 0,
          createdAt: Date.now()
        };
        state.sentences.push(doc);
      }
      saveSentences();
    }catch(e){
      console.error("generation failed", e);
      state.genError = (e && e.message) ? e.message : "產生失敗";
    }
    state.generating = false;
    buildQueueIfNeeded(true);
    render();
  }

  // ---------------- practice flow ----------------
  function buildQueueIfNeeded(force){
    if (!force && state.queue.length > 0) return;
    var pending = state.sentences.filter(function(s){ return s.status !== "mastered"; }).map(function(s){ return s.id; });
    state.queue = shuffle(pending);
    setupCurrentCard();
  }

  function setupCurrentCard(){
    state.feedback = null;
    if (state.queue.length === 0){ state.current = null; return; }
    var id = state.queue[0];
    var sentence = state.sentences.filter(function(s){ return s.id === id; })[0];
    if (!sentence){ state.queue.shift(); return setupCurrentCard(); }
    state.current = sentence;

    var tokenEnglish = sentence.tokenEnglish || [];
    var correctTiles = sentence.tokens.map(function(t, idx){
      return { text: t, english: tokenEnglish[idx] || "" };
    });

    var usedThai = sentence.tokens;
    var otherVocab = state.vocab.filter(function(v){ return usedThai.indexOf(v.thai) === -1; });
    var distractorPool = shuffle(otherVocab).slice(0, Math.min(3, otherVocab.length))
      .map(function(v){ return { text: v.thai, english: v.english || "" }; });

    state.tileBank = shuffle(correctTiles.concat(distractorPool)).map(function(t){
      return { text: t.text, english: t.english, used: false };
    });
    state.buildZone = [];
  }

  function pickTile(bankIdx){
    if (state.checking || state.feedback) return;
    var tile = state.tileBank[bankIdx];
    if (!tile || tile.used) return;
    tile.used = true;
    state.buildZone.push({ text: tile.text, english: tile.english, bankIndex: bankIdx });
    render();
  }

  function unpickTile(buildIdx){
    if (state.checking || state.feedback) return;
    var item = state.buildZone[buildIdx];
    if (!item) return;
    state.tileBank[item.bankIndex].used = false;
    state.buildZone.splice(buildIdx, 1);
    render();
  }

  function clearBuild(){
    if (state.checking || state.feedback) return;
    state.buildZone.forEach(function(it){ state.tileBank[it.bankIndex].used = false; });
    state.buildZone = [];
    render();
  }

  async function checkAnswer(){
    if (!state.current || state.buildZone.length === 0 || state.checking) return;
    var built = state.buildZone.map(function(b){ return b.text; }).join("");
    var target = state.current.thai;

    if (built === target){
      return finalizeResult(true, "完全正確！");
    }

    state.checking = true; render();

    if (!getApiKey()){
      state.checking = false;
      return finalizeResult(false, "尚未設定 Gemini API 金鑰，已使用精確比對判斷。");
    }

    var prompt = "泰語學習者需要把中文句子翻譯成泰語,用詞塊拼出答案。\n" +
      "中文原句:" + state.current.mandarin + "\n" +
      "參考正確泰語答案:" + target + "\n" +
      "學習者拼出的泰語:" + built + "\n" +
      "請判斷學習者拼出的泰語是否語法正確且與中文原句意思一致（允許與參考答案不同但同樣正確的合理表達）。\n" +
      "只回覆一個JSON物件,不要有其他文字，說明文字須使用繁體中文：{\"correct\": true或false, \"feedback\": \"不超過25個繁體中文字的簡短說明\"}";

    try{
      var result = await callGemini(prompt);
      state.checking = false;
      finalizeResult(!!result.correct, result.feedback || (result.correct ? "回答正確！" : "再檢查一下語序。"));
    }catch(e){
      state.checking = false;
      var msg = "AI 校驗暫時不可用（" + ((e && e.message) ? e.message : "未知錯誤") + "），已判定為需要再練習一次。";
      finalizeResult(false, msg);
    }
  }

  function finalizeResult(correct, note){
    var s = state.current;
    var patch = { totalAttempts: (s.totalAttempts||0) + 1 };
    if (correct){
      patch.correctStreak = (s.correctStreak||0) + 1;
      patch.status = patch.correctStreak >= 2 ? "mastered" : "learning";
    } else {
      patch.correctStreak = 0;
      patch.wrongCount = (s.wrongCount||0) + 1;
      patch.status = "retry";
    }
    Object.assign(s, patch);
    saveSentences();

    state.queue.shift();
    if (!correct){
      var reinsertAt = Math.min(2, state.queue.length);
      state.queue.splice(reinsertAt, 0, s.id);
    }
    state.feedback = { correct: correct, correctText: s.thai, note: note };
    render();
  }

  function nextCard(){
    setupCurrentCard();
    render();
  }

  // ---------------- render ----------------
  function render(){
    var main = $("#main");
    main.innerHTML = "";
    $("#topbar-sub").textContent = state.view === "vocab" ? "泰語詞彙學習" : state.view === "practice" ? "拼句練習" : "學習進度";

    document.querySelectorAll(".tabbar button").forEach(function(b){
      b.classList.toggle("active", b.getAttribute("data-tab") === state.view);
    });

    if (!state.ready){
      main.appendChild(el("div", {class:"empty"}, [
        el("span", {class:"glyph", text:"…"}),
        el("p", {class:"zh", text:"正在載入..."})
      ]));
      return;
    }

    if (state.view === "vocab") renderVocab(main);
    else if (state.view === "practice") renderPractice(main);
    else renderProgress(main);

    var fab = $("#fab");
    fab.style.display = (state.view === "vocab") ? "flex" : "none";

    renderModal();
  }

  window.renderApp = render;

  function openAddModal(){
    state.showAddModal = true; state.showSettingsModal = false;
    render();
    var t = $("#modal-thai-input");
    if (t) t.focus();
  }
  function closeAddModal(){ state.showAddModal = false; render(); }

  function openSettingsModal(){
    state.showSettingsModal = true; state.showAddModal = false;
    render();
  }
  function closeSettingsModal(){ state.showSettingsModal = false; render(); }

  function renderModal(){
    var root = $("#modal-root");
    root.innerHTML = "";
    if (state.showAddModal) renderAddModal(root);
    else if (state.showSettingsModal) renderSettingsModal(root);
  }

  function renderAddModal(root){
    var backdrop = el("div", {class:"modal-backdrop"});
    backdrop.addEventListener("click", function(e){ if (e.target === backdrop) closeAddModal(); });

    var sheet = el("div", {class:"sheet"});
    sheet.appendChild(el("div", {class:"sheet-handle"}));

    var head = el("div", {class:"sheet-head"}, [
      el("h3", {class:"zh", text:"新增單字"})
    ]);
    var closeBtn = el("button", {class:"sheet-close", html:"&times;"});
    closeBtn.addEventListener("click", closeAddModal);
    head.appendChild(closeBtn);
    sheet.appendChild(head);

    var form = el("div", {class:"add-form"});
    var row = el("div", {class:"row"});
    var thaiInput = el("input", {class:"th", id:"modal-thai-input", placeholder:"泰語單字", type:"text"});
    var enInput = el("input", {class:"en", placeholder:"英文拼音（選填）", type:"text"});
    row.appendChild(thaiInput); row.appendChild(enInput);
    form.appendChild(row);
    var row2 = el("div", {class:"row"});
    var zhInput = el("input", {class:"zh", placeholder:"中文意思", type:"text"});
    row2.appendChild(zhInput);
    form.appendChild(row2);
    form.appendChild(el("div", {class:"hint zh", text:"新增後可以繼續輸入下一個單字，完成後點右上角關閉"}));
    var addBtn = el("button", {class:"btn btn-brand zh", text:"新增單字", style:"margin-top:14px;"});
    function submit(){
      if (!thaiInput.value.trim() || !zhInput.value.trim()) return;
      addVocab(thaiInput.value, enInput.value, zhInput.value);
      thaiInput.value = ""; enInput.value = ""; zhInput.value = "";
      thaiInput.focus();
    }
    addBtn.addEventListener("click", submit);
    zhInput.addEventListener("keydown", function(e){ if (e.key === "Enter") submit(); });
    form.appendChild(addBtn);
    sheet.appendChild(form);

    backdrop.appendChild(sheet);
    root.appendChild(backdrop);
  }

  function renderSettingsModal(root){
    var backdrop = el("div", {class:"modal-backdrop"});
    backdrop.addEventListener("click", function(e){ if (e.target === backdrop) closeSettingsModal(); });

    var sheet = el("div", {class:"sheet"});
    sheet.appendChild(el("div", {class:"sheet-handle"}));

    var head = el("div", {class:"sheet-head"}, [
      el("h3", {class:"zh", text:"Gemini API 設定"})
    ]);
    var closeBtn = el("button", {class:"sheet-close", html:"&times;"});
    closeBtn.addEventListener("click", closeSettingsModal);
    head.appendChild(closeBtn);
    sheet.appendChild(head);

    var form = el("div", {class:"add-form"});
    var row = el("div", {class:"row"});
    var keyInput = el("input", {class:"en", type:"text", placeholder:"貼上你的 Gemini API 金鑰", value: state.geminiApiKey || ""});
    row.appendChild(keyInput);
    form.appendChild(row);
    form.appendChild(el("div", {class:"hint zh",
      html:'金鑰只會儲存在你這台裝置的瀏覽器中，不會上傳到任何伺服器。尚未取得金鑰？前往 <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Google AI Studio</a> 免費申請。'}));

    var saveBtn = el("button", {class:"btn btn-brand zh", text:"儲存金鑰", style:"margin-top:14px;"});
    saveBtn.addEventListener("click", function(){
      saveApiKey(keyInput.value.trim());
      closeSettingsModal();
    });
    form.appendChild(saveBtn);

    if (state.geminiApiKey){
      var clearBtn = el("button", {class:"btn btn-ghost zh", text:"清除金鑰", style:"margin-top:10px;"});
      clearBtn.addEventListener("click", function(){ saveApiKey(""); closeSettingsModal(); });
      form.appendChild(clearBtn);
    }

    sheet.appendChild(form);
    backdrop.appendChild(sheet);
    root.appendChild(backdrop);
  }

  function renderVocab(main){
    if (state.vocab.length === 0){
      main.appendChild(el("div", {class:"empty", style:"margin-top:16vh;"}, [
        el("span", {class:"glyph th", text:"คำ"}),
        el("h2", {class:"zh", text:"還沒有單字"}),
        el("p", {class:"zh", text:"點右下角的「＋」按鈕，輸入你學到的第一個泰語單字與中文意思，開始建立你的詞庫。"})
      ]));
      return;
    }

    main.appendChild(el("div", {class:"section-label zh", text:"我的詞彙 · " + state.vocab.length}));
    var list = el("div", {});
    state.vocab.forEach(function(v){
      var delBtn = el("button", {class:"del", html:"&times;"});
      delBtn.addEventListener("click", function(){ deleteVocab(v.id); });
      var thWrap = el("div", {class:"th-word th"}, [
        el("span", {text:v.thai})
      ]);
      if (v.english){ thWrap.appendChild(el("span", {class:"en-word en", text:v.english})); }
      var row = el("div", {class:"vocab-row"}, [
        el("div", {}, [
          thWrap,
          el("div", {class:"zh-word zh", text:v.mandarin})
        ]),
        delBtn
      ]);
      list.appendChild(row);
    });
    main.appendChild(list);
  }

  function renderPractice(main){
    if (!getApiKey()){
      main.appendChild(el("div", {class:"empty"}, [
        el("span", {class:"glyph", text:"AI"}),
        el("h2", {class:"zh", text:"尚未設定 Gemini API 金鑰"}),
        el("p", {class:"zh", text:"請先設定 Gemini API 金鑰，才能使用 AI 出題與批改功能。"})
      ]));
      var setBtn = el("button", {class:"btn btn-accent zh", text:"前往設定"});
      setBtn.addEventListener("click", openSettingsModal);
      main.appendChild(setBtn);
      return;
    }

    if (state.vocab.length === 0){
      main.appendChild(el("div", {class:"empty"}, [
        el("span", {class:"glyph th", text:"คำ"}),
        el("h2", {class:"zh", text:"先新增幾個單字"}),
        el("p", {class:"zh", text:"到「詞彙」頁面新增你學過的泰語單字，AI 會用它們為你出練習句子。"})
      ]));
      return;
    }

    if (state.queue.length === 0 && !state.current){ buildQueueIfNeeded(true); }

    if (state.queue.length === 0){
      main.appendChild(el("div", {class:"empty"}, [
        el("span", {class:"glyph", text:"✓"}),
        el("h2", {class:"zh", text: state.sentences.length ? "本輪練習已全部完成" : "還沒有練習句子"}),
        el("p", {class:"zh", text: state.sentences.length
          ? "所有句子都已掌握，或還沒有句子。讓 AI 用你的詞彙再出一批新句子吧。"
          : "讓 AI 根據你學過的單字，產生第一批練習句子。"})
      ]));
      var genBtn = el("button", {class:"btn btn-accent zh", text: state.generating ? "AI 正在出題..." : "AI 產生新句子"});
      genBtn.disabled = state.generating;
      genBtn.addEventListener("click", generateSentences);
      main.appendChild(genBtn);
      if (state.genError){
        main.appendChild(el("div", {class:"hint zh", style:"text-align:center;margin-top:10px;color:var(--danger);", text:"產生失敗：" + state.genError}));
      }
      return;
    }

    var totalInRound = Math.max(state.queue.length + (state.feedback ? 1 : 0), 1);
    var doneCount = totalInRound - state.queue.length;
    var track = el("div", {class:"queue-track"}, [
      el("div", {class:"bar"}, [el("i", {style:"width:" + Math.round(100*doneCount/totalInRound) + "%"})]),
      el("span", {class:"zh", text: state.queue.length + " 句待完成"})
    ]);
    main.appendChild(track);

    if (!state.current){ setupCurrentCard(); }
    if (!state.current) return;

    main.appendChild(el("div", {class:"prompt-card"}, [
      el("div", {class:"label zh", text:"請把下面的意思拼成泰語"}),
      el("div", {class:"zh-sentence zh", text: state.current.mandarin})
    ]));

    var bz = el("div", {class:"build-zone" + (state.buildZone.length===0 ? " empty-hint" : "")});
    state.buildZone.forEach(function(item, idx){
      var t = el("button", {class:"tile placed"});
      t.appendChild(el("span", {class:"tile-th th", text:item.text}));
      if (item.english){ t.appendChild(el("span", {class:"tile-en en", text:item.english})); }
      t.addEventListener("click", function(){ unpickTile(idx); });
      bz.appendChild(t);
    });
    main.appendChild(bz);

    if (state.feedback){
      var fb = state.feedback;
      var box = el("div", {class:"feedback " + (fb.correct ? "correct" : "incorrect")});
      box.appendChild(el("div", {class:"verdict zh", text: fb.correct ? "✓ 正確" : "✗ 需要再練一次"}));
      if (!fb.correct){
        box.appendChild(el("div", {class:"answer-th th", text: fb.correctText}));
      }
      box.appendChild(el("div", {class:"note zh", text: fb.note}));
      main.appendChild(box);

      var nextBtn = el("button", {class:"btn btn-brand zh", text: state.queue.length ? "繼續下一句" : "查看結果"});
      nextBtn.addEventListener("click", nextCard);
      main.appendChild(nextBtn);
      return;
    }

    if (state.checking){
      main.appendChild(el("div", {class:"spinner-line zh"}, [
        el("span", {class:"dot"}), el("span", {class:"dot"}), el("span", {class:"dot"}),
        el("span", {text:"AI 正在檢查你的答案..."})
      ]));
      return;
    }

    main.appendChild(el("div", {class:"bank-label zh", text:"點選詞塊拼出句子"}));
    var bank = el("div", {class:"bank"});
    state.tileBank.forEach(function(tile, idx){
      var t = el("button", {class:"tile" + (tile.used ? " used" : "")});
      t.appendChild(el("span", {class:"tile-th th", text:tile.text}));
      if (tile.english){ t.appendChild(el("span", {class:"tile-en en", text:tile.english})); }
      t.addEventListener("click", function(){ pickTile(idx); });
      bank.appendChild(t);
    });
    main.appendChild(bank);

    var actions = el("div", {class:"action-row"});
    var clearBtn = el("button", {class:"btn btn-ghost zh", text:"清空"});
    clearBtn.addEventListener("click", clearBuild);
    var checkBtn = el("button", {class:"btn btn-brand zh", text:"檢查答案"});
    checkBtn.disabled = state.buildZone.length === 0;
    checkBtn.addEventListener("click", checkAnswer);
    actions.appendChild(clearBtn); actions.appendChild(checkBtn);
    main.appendChild(actions);
  }

  function renderProgress(main){
    var mastered = state.sentences.filter(function(s){ return s.status === "mastered"; }).length;
    var totalAttempts = state.sentences.reduce(function(a,s){ return a + (s.totalAttempts||0); }, 0);
    var totalWrong = state.sentences.reduce(function(a,s){ return a + (s.wrongCount||0); }, 0);
    var accuracy = totalAttempts > 0 ? Math.round(100 * (totalAttempts - totalWrong) / totalAttempts) : null;

    var grid = el("div", {class:"stat-grid"}, [
      el("div", {class:"stat-box"}, [el("div", {class:"num", text:state.vocab.length}), el("div", {class:"lbl zh", text:"已學單字"})]),
      el("div", {class:"stat-box"}, [el("div", {class:"num", text:state.sentences.length}), el("div", {class:"lbl zh", text:"練習句子"})]),
      el("div", {class:"stat-box"}, [el("div", {class:"num", text:mastered}), el("div", {class:"lbl zh", text:"已掌握"})]),
      el("div", {class:"stat-box"}, [el("div", {class:"num", text: accuracy===null ? "—" : accuracy + "%"}), el("div", {class:"lbl zh", text:"正確率"})])
    ]);
    main.appendChild(grid);

    if (state.sentences.length === 0){
      main.appendChild(el("div", {class:"empty"}, [
        el("span", {class:"glyph", text:"◐"}),
        el("p", {class:"zh", text:"還沒有練習紀錄，到「練習」頁面開始第一輪吧。"})
      ]));
      return;
    }

    main.appendChild(el("div", {class:"section-label zh", text:"句子練習狀況"}));
    var list = el("div", {});
    state.sentences.slice().sort(function(a,b){ return (b.createdAt||0)-(a.createdAt||0); }).forEach(function(s){
      var badgeClass = s.status === "mastered" ? "mastered" : (s.status === "new" ? "new" : "learning");
      var badgeText = s.status === "mastered" ? "已掌握" : (s.status === "new" ? "尚未練習" : "練習中");
      list.appendChild(el("div", {class:"word-progress-row"}, [
        el("div", {}, [
          el("div", {class:"th-word th", text:s.thai}),
          el("div", {class:"zh zh-word", style:"color:var(--ink-soft);font-size:12.5px;margin-top:2px;", text:s.mandarin})
        ]),
        el("span", {class:"badge zh " + badgeClass, text:badgeText})
      ]));
    });
    main.appendChild(list);
  }

  // ---------------- fab / settings wiring ----------------
  $("#fab").addEventListener("click", openAddModal);
  $("#settings-btn").addEventListener("click", openSettingsModal);

  // ---------------- tab wiring ----------------
  document.querySelectorAll(".tabbar button").forEach(function(btn){
    btn.addEventListener("click", function(){
      state.view = btn.getAttribute("data-tab");
      if (state.view === "practice"){ buildQueueIfNeeded(false); }
      render();
    });
  });

  init();
})();
</script>

    vocab.push({
      id: doc.id,
      ...doc.data()
    });

  });

  if (window.appState && window.renderApp) {

    window.appState.vocab = vocab;

    window.renderApp();

  }

};

document
  .getElementById("googleLoginBtn")
  .addEventListener("click", async () => {

    try {

      await signInWithPopup(
        auth,
        provider
      );

    } catch (err) {

      console.error(err);

      alert(
        "Google 登入失敗：" +
        err.message
      );

    }

});

onAuthStateChanged(auth, (user) => {

if (user) {

  window.currentUid = user.uid;

  console.log(
    "登入成功：",
    user.displayName
  );

  loadFirestoreVocab();

  document
    .getElementById("loginPage")
    .style.display = "none";

  document
    .getElementById("app")
    .style.display = "block";

}

});

</script>
